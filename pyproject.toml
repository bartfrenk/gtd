[project]
name = "gtd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gkeepapi>=0.17.1",
    "google-api-python-client>=2.200.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
gtd = "gtd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.4.1",
    "ipdb>=0.13.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: hits real external services, needs --integration to run"]
asyncio_mode = "auto"

[tool.pyright]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownLambdaType = false
